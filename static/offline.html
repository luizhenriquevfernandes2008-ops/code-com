<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1721">
  <title>Code com · sem conexão</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(ellipse at 18% 22%, #1d665477, transparent 38%), #0d1721;
      color: #f0faf7; font: 16px/1.5 "Segoe UI", system-ui, sans-serif; }
    main { width: min(100%, 440px); padding: 32px; border: 1px solid #a9f4db33; border-radius: 22px;
      background: #101f29ed; text-align: center; box-shadow: 0 28px 80px #02080d88; }
    .logo { width: 72px; height: 72px; margin: 0 auto 18px; }
    h1 { margin: 0; font-size: 25px; }
    p { margin: 12px 0 24px; color: #9bb4b2; }
    a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 0 18px;
      border-radius: 10px; background: #50d8aa; color: #062019; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/icons/codecom.svg" alt="">
    <h1>O Code com está sem conexão</h1>
    <p>Confira sua internet. Se você usa o Code com neste computador, abra o launcher da pasta do Desktop e tente novamente.</p>
    <a href="/">Tentar novamente</a>
  </main>
</body>
</html>
